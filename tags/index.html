<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网站维护中 - LZH的小窝</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1b1c20 0%, #2a2d34 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .wrap { max-width: 560px; }
  .icon { font-size: 4.5rem; margin-bottom: 1.2rem; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.9rem; font-weight: 700; margin-bottom: .8rem; letter-spacing: .06em; }
  .sub { font-size: 1.05rem; color: rgba(255,255,255,.72); line-height: 1.9; margin-bottom: 1.6rem; }
  .divider { width: 64px; height: 3px; background: #425AEF; border-radius: 2px; margin: 0 auto 1.6rem; }
  .badge {
    display: inline-block; padding: .45rem 1.1rem; border-radius: 999px;
    background: rgba(66,90,239,.16); color: #8fa0ff; border: 1px solid rgba(66,90,239,.4);
    font-size: .85rem; letter-spacing: .12em;
  }
  footer { margin-top: 2.4rem; font-size: .8rem; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🛠️</div>
    <h1>网站维护中</h1>
    <div class="divider"></div>
    <p class="sub">本站正在进行短暂的维护升级<br>请稍后再来，感谢你的理解与支持</p>
    <span class="badge">LZH的小窝 · 凡是过往，皆为序章</span>
    <footer>blog.lzh.life</footer>
  </div>
</body>
</html>
